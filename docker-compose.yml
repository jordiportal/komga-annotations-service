---
version: '3.3'
services:
  annotations:
    build: .
    image: komga-annotations-service:latest
    container_name: komga-annotations
    environment:
      - LITELLM_URL=https://litellm.khlloreda.com
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LLM_MODEL=deepseek-v4-flash
      - OCR_MODEL=qwen3-omni
      - PORT=8787
    ports:
      - 8787:8787
    volumes:
      - annotations-data:/app/data
    restart: unless-stopped

volumes:
  annotations-data:
